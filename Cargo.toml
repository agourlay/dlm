[package]
name = "dlm"
version = "0.8.0"
authors = ["Arnaud Gourlay <arnaud.gourlay@gmail.com>"]
description = "Minimal download manager"
repository = "https://github.com/agourlay/dlm"
license = "Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["http", "download", "download-manager"]
# the landing page and its capture are for GitHub, not for the crate
exclude = ["demo.gif", "site/"]
edition = "2024"

[dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "gzip",
    "rustls",
] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "fs",
    "macros",
    "signal",
    "process",
    "time",
] }
tokio-util = "0.7.19"
async-channel = "2.5.0"
clap = { version = "4.6.4", features = ["cargo"] }
indicatif = "0.18.6"
# already in the tree via indicatif, used here for the terminal size and colors
console = "0.16.4"
thiserror = "2.0.19"
rand = "0.10.2"
jiff = "0.2.35"
percent-encoding = "2.3.2"
base64 = "0.23.0"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
